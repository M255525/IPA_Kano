<body>
<div class="app-header">
  <h1>產品／服務滿意度分析互動儀表板</h1>
  <p>IPA 重要度—表現度矩陣 × Kano 品質屬性整合分析｜依 2 / 4 / 6 / 8 / 10 分計分</p>
</div>

<div class="tabs" id="tabBar">
  <button class="tab-btn active" data-tab="import">① 資料匯入</button>
  <button class="tab-btn" data-tab="ipa">② IPA 矩陣</button>
  <button class="tab-btn" data-tab="kano">③ Kano 分析</button>
  <button class="tab-btn" data-tab="priority">④ 整合優先序</button>
  <button class="tab-btn" data-tab="pareto">⑤ 柏拉圖分析</button>
  <button class="tab-btn" data-tab="comments">⑥ 補充意見</button>
  <button class="tab-btn" data-tab="export">⑦ 匯出報告</button>
</div>

<main id="mainArea"></main>

<footer class="no-print">本儀表板為靜態單一網頁應用，所有資料處理均於您的瀏覽器本機端執行，不會上傳到任何伺服器。</footer>

<div id="printReportRoot" class="print-only"></div>

<script>
/* ===================== 核心分析邏輯（與計畫書第三～五章一致） ===================== */
const KANO_TABLE = {
  like:    { like:"Q", mustbe:"A", neutral:"A", livewith:"A", dislike:"O" },
  mustbe:  { like:"R", mustbe:"I", neutral:"I", livewith:"I", dislike:"M" },
  neutral: { like:"R", mustbe:"I", neutral:"I", livewith:"I", dislike:"M" },
  livewith:{ like:"R", mustbe:"I", neutral:"I", livewith:"I", dislike:"M" },
  dislike: { like:"R", mustbe:"R", neutral:"R", livewith:"R", dislike:"Q" },
};
/* 文字李克特量表 -> 2/4/6/8/10 分對照（重要度、表現度共用同一份對照表） */
const TEXT_SCALE_MAP = {
  "非常不重要": 2, "非常不滿意": 2, "表現很不好": 2, "非常不好": 2,
  "不重要": 4, "不滿意": 4, "表現不好": 4,
  "普通": 6, "尚可": 6,
  "重要": 8, "滿意": 8, "表現好": 8,
  "非常重要": 10, "非常滿意": 10, "表現很好": 10, "非常好": 10,
};
function normalizeScoreValue(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (s === "") return null;
  if (!isNaN(Number(s))) return Number(s);
  if (Object.prototype.hasOwnProperty.call(TEXT_SCALE_MAP, s)) return TEXT_SCALE_MAP[s];
  return null;
}

function normalizeKanoAnswer(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (["1","很喜歡","喜歡","非常喜歡","太棒了"].includes(s)) return "like";
  if (["2","理應如此","應該的","本來就該有","理所當然"].includes(s)) return "mustbe";
  if (["3","無所謂","普通","沒感覺","沒差","沒意見"].includes(s)) return "neutral";
  if (["4","勉強接受","可以接受","能忍受","尚可接受"].includes(s)) return "livewith";
  if (["5","不喜歡","不滿意","無法接受","不能接受"].includes(s)) return "dislike";
  return null;
}
function kanoClassify(funcAns, dysAns) {
  const f = normalizeKanoAnswer(funcAns);
  const d = normalizeKanoAnswer(dysAns);
  if (!f || !d) return null;
  return KANO_TABLE[f][d];
}
const PRIORITY_MATRIX = {
  Q2: { M:1, O:1, A:2, I:3 },
  Q1: { M:4, O:4, A:3, I:5 },
  Q3: { M:2, O:3, A:5, I:5 },
  Q4: { M:5, O:5, A:4, I:5 },
};
function priorityFor(quadrant, attribute) {
  if (!quadrant || attribute === "R" || attribute === "Q" || !attribute) return null;
  const row = PRIORITY_MATRIX[quadrant];
  return row ? (row[attribute] ?? null) : null;
}
function meanOf(arr) { return arr.length ? arr.reduce((a,b)=>a+b,0) / arr.length : null; }

function aggregateRows(rows) {
  const byItem = {};
  const order = [];
  for (const r of rows) {
    const key = (r.item || "").trim();
    if (!key) continue;
    if (!byItem[key]) { byItem[key] = { item:key, importances:[], performances:[], kanoVotes:{M:0,O:0,A:0,I:0,R:0,Q:0}, comments:[] }; order.push(key); }
    const g = byItem[key];
    const impVal = normalizeScoreValue(r.importance);
    if (impVal !== null) g.importances.push(impVal);
    const perfVal = normalizeScoreValue(r.performance);
    if (perfVal !== null) g.performances.push(perfVal);
    const cls = kanoClassify(r.kanoFunc, r.kanoDys);
    if (cls) g.kanoVotes[cls]++;
    if (r.comment && String(r.comment).trim()) g.comments.push(String(r.comment).trim());
  }
  const items = order.map(key => {
    const g = byItem[key];
    const impMean = meanOf(g.importances);
    const perfMean = meanOf(g.performances);
    const votes = g.kanoVotes;
    const totalVotes = Object.values(votes).reduce((a,b)=>a+b,0);
    let finalAttr = null, topVote = -1;
    if (totalVotes > 0) {
      for (const k of ["M","O","A","I","R","Q"]) { if (votes[k] > topVote) { topVote = votes[k]; finalAttr = k; } }
    }
    return { item:key, impMean, perfMean, votes, totalVotes, finalAttr, comments:g.comments, respondents: Math.max(g.importances.length, g.performances.length, totalVotes) };
  });
  const impMeans = items.filter(i=>i.impMean!==null).map(i=>i.impMean);
  const perfMeans = items.filter(i=>i.perfMean!==null).map(i=>i.perfMean);
  const grandImp = meanOf(impMeans);
  const grandPerf = meanOf(perfMeans);
  for (const it of items) {
    if (it.impMean === null || it.perfMean === null || grandImp === null || grandPerf === null) { it.quadrant = null; continue; }
    const highImp = it.impMean >= grandImp;
    const highPerf = it.perfMean >= grandPerf;
    it.quadrant = highImp && highPerf ? "Q1" : highImp && !highPerf ? "Q2" : !highImp && !highPerf ? "Q3" : "Q4";
  }
  for (const it of items) it.priority = priorityFor(it.quadrant, it.finalAttr);
  return { items, grandImp, grandPerf };
}


/* ===================== 範例資料產生器（示範用途） ===================== */
function seededRandom(seed) {
  let s = seed;
  return function() { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}
function buildSampleRows() {
  const rnd = seededRandom(42);
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const scoreOptions = [2,4,6,8,10];
  const kanoOptions = ["很喜歡","理應如此","無所謂","勉強接受","不喜歡"];

  // 每個項目設定「傾向」，讓抽樣結果落在對應象限與屬性，展示完整四象限與六種屬性
  const items = [
    { name:"到貨速度",         impBias:[8,10,10,8],  perfBias:[4,6,4,2],  funcBias:["很喜歡","很喜歡","理應如此"], dysBias:["不喜歡","不喜歡"], comments:["希望能再更快一點","常常等超過三天","偶爾會延遲，需要加強"] },
    { name:"客服回應時間",     impBias:[8,10,8],     perfBias:[4,2,6],    funcBias:["很喜歡","理應如此"], dysBias:["不喜歡"], comments:["客服等太久了","希望有即時聊天功能"] },
    { name:"商品完好無損",     impBias:[10,10,8],    perfBias:[10,8,10],  funcBias:["理應如此","理應如此","很喜歡"], dysBias:["不喜歡","不喜歡"], comments:["包裝很扎實，沒有損壞","一直都很滿意這點"] },
    { name:"付款方式多元",     impBias:[8,10,8],     perfBias:[8,10,8],   funcBias:["理應如此","很喜歡"], dysBias:["不喜歡","勉強接受"], comments:["行動支付選項很齊全"] },
    { name:"驚喜贈品／小卡",   impBias:[2,4,4],       perfBias:[4,2,6],   funcBias:["很喜歡","很喜歡"], dysBias:["無所謂","勉強接受"], comments:["收到小卡很開心","希望常態化提供"] },
    { name:"包裝設計質感",     impBias:[4,2,4],       perfBias:[8,10,8],  funcBias:["很喜歡","無所謂"], dysBias:["無所謂","勉強接受"], comments:["包裝很有質感，超乎預期"] },
    { name:"會員積點制度",     impBias:[4,2,6],       perfBias:[4,2,6],   funcBias:["無所謂","勉強接受"], dysBias:["無所謂","無所謂"], comments:["很少使用這個功能"] },
    { name:"退換貨流程",       impBias:[8,10,8],      perfBias:[6,8,6],   funcBias:["理應如此","很喜歡"], dysBias:["不喜歡","不喜歡"], comments:["流程算清楚，但要等比較久才退款"] },
    { name:"APP介面操作",      impBias:[6,8,6],       perfBias:[4,6,4],   funcBias:["很喜歡","理應如此"], dysBias:["勉強接受","不喜歡"], comments:["介面有點卡頓，希望優化","部分按鈕不好找"] },
    { name:"專屬客服人員",     impBias:[2,4,2],       perfBias:[8,6,8],   funcBias:["很喜歡","無所謂"], dysBias:["無所謂","無所謂"], comments:["其實不太需要，但有的話也不錯"] },
  ];

  const rows = [];
  let idCounter = 1;
  for (const it of items) {
    const respondents = 24 + Math.floor(rnd()*8); // 24~31 位
    for (let i=0;i<respondents;i++) {
      const importance = pick(it.impBias);
      const performance = pick(it.perfBias);
      const kanoFunc = pick(it.funcBias);
      const kanoDys = pick(it.dysBias);
      const comment = (rnd() < 0.18 && it.comments.length) ? pick(it.comments) : "";
      rows.push({
        受訪者編號: "R" + String(idCounter++).padStart(3,"0"),
        題項: it.name,
        重要度: importance,
        表現度: performance,
        Kano正向: kanoFunc,
        Kano反向: kanoDys,
        補充說明: comment,
      });
    }
  }
  return rows;
}


/* ===================== 全域狀態與工具函式 ===================== */
const STATE = {
  sources: [],             // 已加入的資料來源：{ id, label, mode, longRows, itemCount, rowCount }
  sourceCounter: 0,
  pendingSource: null,     // 尚待手動欄位對應的長表格來源：{ label, headers, rawRows, mapping }
  rows: [],                // 對齊題項名稱後、合併所有來源的標準列
  items: [],               // aggregateRows() 結果
  grandImp: null,
  grandPerf: null,
  analyzed: false,
  hasKanoData: false,
  hasIPAData: false,
};

const QUADRANT_LABEL = { Q1:"第一象限．優勢保持區", Q2:"第二象限．集中改善區", Q3:"第三象限．次要改善區", Q4:"第四象限．過度供給區" };
const QUADRANT_COLOR = { Q1:"var(--q1)", Q2:"var(--q2)", Q3:"var(--q3)", Q4:"var(--q4)" };
const ATTR_LABEL = { M:"必須品質 M", O:"一維品質 O", A:"魅力品質 A", I:"無差異品質 I", R:"反向品質 R", Q:"可疑結果 Q" };
const ATTR_COLOR = { M:"var(--m)", O:"var(--o)", A:"var(--a)", I:"var(--i)", R:"var(--r)", Q:"var(--qq)" };
const PRIORITY_COLOR = { 1:"var(--p1)", 2:"var(--p2)", 3:"var(--p3)", 4:"var(--p4)", 5:"var(--p5)" };
const PRIORITY_LABEL = { 1:"優先度 1．立即改善", 2:"優先度 2．值得投入", 3:"優先度 3．次要", 4:"優先度 4．持續維持", 5:"優先度 5．低度關注" };
const MODE_LABEL = { wide:"IPA 寬表格", wideKano:"Kano 專用寬表格", long:"長表格（手動對應）", sample:"示範資料" };

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function fmt1(n) { return (n === null || n === undefined || isNaN(n)) ? "—" : n.toFixed(1); }

function badge(text, color, outline) {
  return `<span class="badge${outline?' outline':''}" style="${outline?`color:${color};`:`background:${color};`}">${escapeHtml(text)}</span>`;
}

/* ---- 欄位名稱正規化（處理全形／半形括號等差異） ---- */
function normHeader(h) {
  return String(h ?? "").trim().replace(/（/g, "(").replace(/）/g, ")").replace(/，/g, ",");
}

/* ---- 寬表格自動偵測（IPA）：同一欄名恰好出現兩次 -> 視為「重要度欄」與「表現度欄」配對 ---- */
function detectWideFormat(headers) {
  const groups = {};
  headers.forEach((h, idx) => {
    const key = normHeader(h);
    if (!key) return;
    if (!groups[key]) groups[key] = [];
    groups[key].push(idx);
  });
  const pairs = [];
  for (const key of Object.keys(groups)) {
    if (groups[key].length === 2) {
      pairs.push({ item: key, impIdx: groups[key][0], perfIdx: groups[key][1] });
    }
  }
  return pairs;
}

function convertWideRowsToLongRows(rawRows, pairs) {
  const rows = [];
  for (const r of rawRows) {
    for (const p of pairs) {
      const impRaw = r[p.impIdx];
      const perfRaw = r[p.perfIdx];
      if ((impRaw === undefined || impRaw === null || impRaw === "") && (perfRaw === undefined || perfRaw === null || perfRaw === "")) continue;
      rows.push({ item: p.item, importance: impRaw, performance: perfRaw, kanoFunc: null, kanoDys: null, comment: null });
    }
  }
  return rows;
}

/* ---- 寬表格自動偵測（Kano 專用）：無題項欄，而是「正向題欄＋反向題欄」各一組 ---- */
const POS_SUFFIX = ["非常好","很好","好","佳","棒","優","強","足夠","充足","滿意"];
const NEG_SUFFIX = ["非常不好","很不好","不好","差","弱","不足","不佳","不滿意"];
const NEG_WORDS = ["沒","不","無","未"];

function stripSuffix(text, suffixList) {
  const sorted = [...suffixList].sort((a,b)=>b.length-a.length);
  for (const suf of sorted) {
    if (text.endsWith(suf)) return text.slice(0, -suf.length);
  }
  return null;
}

function classifyKanoHeader(h) {
  const t = normHeader(h);
  const negCore = stripSuffix(t, NEG_SUFFIX);
  if (negCore !== null) return { polarity:"neg", core:negCore };
  const posCore = stripSuffix(t, POS_SUFFIX);
  if (posCore !== null) return { polarity:"pos", core:posCore };
  if (NEG_WORDS.some(w => t.includes(w))) return { polarity:"neg", core:t };
  return { polarity:"pos", core:t };
}

function sampleLooksLikeKanoAnswers(headers, rawRows, colIndices, sampleSize) {
  let checked = 0, matched = 0;
  for (const r of rawRows) {
    for (const idx of colIndices) {
      if (checked >= sampleSize) break;
      const v = r[idx];
      if (v === undefined || v === null || v === "") continue;
      checked++;
      if (normalizeKanoAnswer(v) !== null) matched++;
    }
    if (checked >= sampleSize) break;
  }
  return checked > 0 && (matched / checked) >= 0.8;
}

function commonPrefixLen(a, b) {
  let n = 0;
  while (n < a.length && n < b.length && a[n] === b[n]) n++;
  return n;
}

function detectKanoWideFormat(headers, rawRows) {
  if (!headers.length || headers.length < 4 || headers.length % 2 !== 0) return [];
  const classified = headers.map((h, idx) => Object.assign({ idx: idx }, classifyKanoHeader(h)));
  const positives = classified.filter(c => c.polarity === "pos");
  const negatives = classified.filter(c => c.polarity === "neg");
  if (positives.length === 0 || positives.length !== negatives.length) return [];
  if (!sampleLooksLikeKanoAnswers(headers, rawRows, classified.map(function(c){return c.idx;}), 40)) return [];

  const half = headers.length / 2;
  const firstHalfAllPos = positives.length === half && positives.every(function(c){return c.idx < half;}) && negatives.every(function(c){return c.idx >= half;});

  const pairs = [];
  if (firstHalfAllPos) {
    for (let i = 0; i < half; i++) {
      const pos = positives.find(function(c){ return c.idx === i; });
      const neg = negatives.find(function(c){ return c.idx === i + half; });
      pairs.push({ item: pos.core || normHeader(headers[pos.idx]), funcIdx: pos.idx, dysIdx: neg.idx });
    }
  } else {
    const usedNeg = new Set();
    for (const pos of positives) {
      let bestNeg = null;
      let bestScore = -1;
      for (const neg of negatives) {
        if (usedNeg.has(neg.idx)) continue;
        const score = commonPrefixLen(pos.core, neg.core);
        if (score > bestScore) { bestScore = score; bestNeg = neg; }
      }
      if (bestNeg) { usedNeg.add(bestNeg.idx); pairs.push({ item: pos.core || normHeader(headers[pos.idx]), funcIdx: pos.idx, dysIdx: bestNeg.idx }); }
    }
  }
  return pairs;
}

function convertKanoWideRowsToLongRows(rawRows, pairs) {
  const rows = [];
  for (const r of rawRows) {
    for (const p of pairs) {
      const funcRaw = r[p.funcIdx];
      const dysRaw = r[p.dysIdx];
      if ((funcRaw === undefined || funcRaw === null || funcRaw === "") && (dysRaw === undefined || dysRaw === null || dysRaw === "")) continue;
      rows.push({ item: p.item, importance: "", performance: "", kanoFunc: funcRaw, kanoDys: dysRaw, comment: null });
    }
  }
  return rows;
}

/* ---- 長表格欄位對應猜測：依常見中文欄位名稱做關鍵字比對，回傳欄位「索引」 ---- */
const FIELD_GUESS = {
  item: ["題項","項目","服務項目","功能","構面","題目"],
  importance: ["重要度","重要性"],
  performance: ["表現度","滿意度","表現","滿意"],
  kanoFunc: ["kano正向","正向題","正向","功能性","功能性問題"],
  kanoDys: ["kano反向","反向題","反向","非功能性","非功能性問題"],
  comment: ["補充說明","補充意見","意見","備註","留言","說明"],
};
function guessMapping(headers) {
  const lower = headers.map(h => String(h).toLowerCase());
  const result = {};
  for (const field of Object.keys(FIELD_GUESS)) {
    let found = null;
    for (const kw of FIELD_GUESS[field]) {
      const idx = lower.findIndex(h => h.includes(kw.toLowerCase()));
      if (idx !== -1) { found = idx; break; }
    }
    result[field] = found;
  }
  return result;
}

function buildLongRowsFromMapping(rawRows, mapping) {
  return rawRows.map(r => ({
    item: mapping.item !== null ? r[mapping.item] : "",
    importance: mapping.importance !== null ? r[mapping.importance] : "",
    performance: mapping.performance !== null ? r[mapping.performance] : "",
    kanoFunc: mapping.kanoFunc !== null ? r[mapping.kanoFunc] : "",
    kanoDys: mapping.kanoDys !== null ? r[mapping.kanoDys] : "",
    comment: mapping.comment !== null ? r[mapping.comment] : "",
  }));
}

function sampleRowsToLongRows(objRows) {
  return objRows.map(o => ({
    item: o["題項"], importance: o["重要度"], performance: o["表現度"],
    kanoFunc: o["Kano正向"], kanoDys: o["Kano反向"], comment: o["補充說明"],
  }));
}

/* ---- 多來源管理 ---- */
function addSource(label, mode, longRows) {
  STATE.sourceCounter++;
  const itemSet = new Set(longRows.map(r => (r.item||"").trim()).filter(Boolean));
  const src = { id:"src"+STATE.sourceCounter, label, mode, longRows, itemCount:itemSet.size, rowCount:longRows.length };
  STATE.sources.push(src);
  STATE.analyzed = false;
  return src;
}
function removeSource(id) {
  STATE.sources = STATE.sources.filter(s => s.id !== id);
  STATE.analyzed = false;
}

/* ---- 題項名稱對齊：跨來源比對相似題項，建議統一名稱 ---- */
function charSetJaccard(a, b) {
  const setA = new Set(a.replace(/[()]/g, ""));
  const setB = new Set(b.replace(/[()]/g, ""));
  if (!setA.size || !setB.size) return 0;
  let inter = 0;
  setA.forEach(c => { if (setB.has(c)) inter++; });
  const union = new Set([...setA, ...setB]).size;
  return union ? inter / union : 0;
}

function collectRawItemStats() {
  const map = {};
  for (const src of STATE.sources) {
    for (const r of src.longRows) {
      const name = (r.item || "").trim();
      if (!name) continue;
      if (!map[name]) map[name] = { rawName:name, sourceLabels:new Set(), count:0 };
      map[name].sourceLabels.add(src.label);
      map[name].count++;
    }
  }
  return Object.values(map).map(e => ({ rawName:e.rawName, sourceLabels:[...e.sourceLabels], count:e.count }));
}

function suggestCanonicalLabels(rawItemStats) {
  const names = rawItemStats.map(e => e.rawName);
  const used = new Set();
  const suggestion = {};
  for (const name of names) {
    if (used.has(name)) continue;
    const group = [name];
    used.add(name);
    for (const other of names) {
      if (used.has(other)) continue;
      if (normHeader(other) === normHeader(name)) { group.push(other); used.add(other); continue; }
      if (charSetJaccard(normHeader(name), normHeader(other)) >= 0.55) { group.push(other); used.add(other); }
    }
    const canonical = group.reduce((longest, cur) => cur.length > longest.length ? cur : longest, group[0]);
    group.forEach(g => { suggestion[g] = canonical; });
  }
  return suggestion;
}

/* ---- 合併所有來源並執行分析 ---- */
function finalizeMergedAnalysis(labelMap) {
  const merged = [];
  for (const src of STATE.sources) {
    for (const r of src.longRows) {
      const rawName = (r.item || "").trim();
      if (!rawName) continue;
      const finalName = (labelMap && labelMap[rawName]) ? labelMap[rawName] : rawName;
      merged.push(Object.assign({}, r, { item: finalName }));
    }
  }
  STATE.rows = merged;
  const { items, grandImp, grandPerf } = aggregateRows(merged);
  STATE.items = items;
  STATE.grandImp = grandImp;
  STATE.grandPerf = grandPerf;
  STATE.hasKanoData = items.some(i => i.totalVotes > 0);
  STATE.hasIPAData = grandImp !== null && grandPerf !== null;
  STATE.analyzed = true;
}

/* 落差（重要度－表現度），用於無 Kano 資料時的替代排序 */
function gapOf(it) { return (it.impMean ?? 0) - (it.perfMean ?? 0); }
const QUADRANT_URGENCY = { Q2:0, Q3:1, Q1:2, Q4:3 };
function ipaOnlyRank(items) {
  return [...items].sort((a,b) => {
    const ua = a.quadrant ? QUADRANT_URGENCY[a.quadrant] : 9;
    const ub = b.quadrant ? QUADRANT_URGENCY[b.quadrant] : 9;
    if (ua !== ub) return ua - ub;
    return gapOf(b) - gapOf(a);
  });
}
/* 僅有 Kano 資料時的替代排序：必須品質 > 一維品質 > 魅力品質 > 無差異品質，R／Q 排最後 */
const KANO_URGENCY = { M:0, O:1, A:2, I:3, R:8, Q:9 };
function kanoOnlyRank(items) {
  return [...items].sort((a,b) => {
    const ua = a.finalAttr ? KANO_URGENCY[a.finalAttr] : 9;
    const ub = b.finalAttr ? KANO_URGENCY[b.finalAttr] : 9;
    if (ua !== ub) return ua - ub;
    return (b.totalVotes||0) - (a.totalVotes||0);
  });
}

function downloadTemplate() {
  const header = ["題項","重要度","表現度","Kano正向","Kano反向","補充說明"];
  const example = ["到貨速度","8","4","很喜歡","不喜歡","希望能更快一點"];
  const csv = "﻿" + [header, example].map(r => r.join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "問卷資料範本.csv"; a.click();
  URL.revokeObjectURL(url);
}

function cellToStr(v) { return v === undefined || v === null ? "" : v; }

function handleFiles(fileList) {
  Array.from(fileList).forEach(handleFile);
}

function handleFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".csv")) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const parsed = Papa.parse(e.target.result, { header:false, skipEmptyLines:true });
      if (parsed.errors && parsed.errors.length) {
        showMsg("fileMsg", `「${file.name}」CSV 解析發生問題：` + parsed.errors[0].message, "error");
        return;
      }
      const headerRow = parsed.data[0];
      const bodyRows = parsed.data.slice(1);
      processIncomingTable(headerRow, bodyRows, file.name);
    };
    reader.onerror = () => showMsg("fileMsg", `「${file.name}」讀取失敗，請確認檔案格式。`, "error");
    reader.readAsText(file, "UTF-8");
  } else if (name.endsWith(".xlsx") || name.endsWith(".xls")) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type:"array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const aoa = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" });
        const headerRow = aoa[0];
        const bodyRows = aoa.slice(1);
        processIncomingTable(headerRow, bodyRows, file.name);
      } catch (err) {
        showMsg("fileMsg", `「${file.name}」Excel 解析失敗：` + err.message, "error");
      }
    };
    reader.onerror = () => showMsg("fileMsg", `「${file.name}」讀取失敗，請確認檔案格式。`, "error");
    reader.readAsArrayBuffer(file);
  } else {
    showMsg("fileMsg", `「${file.name}」不支援的檔案格式，請上傳 .csv、.xlsx 或 .xls 檔案。`, "error");
  }
}

function extractSheetId(url) {
  const m = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
  return m ? m[1] : null;
}
function extractGid(url) {
  const m = url.match(/[#&]gid=([0-9]+)/);
  return m ? m[1] : "0";
}

async function handleGsheetLoad() {
  const urlInput = document.getElementById("gsheetUrl");
  const url = urlInput.value.trim();
  if (!url) { showMsg("gsheetMsg", "請先貼上 Google 試算表連結。", "error"); return; }
  const id = extractSheetId(url);
  if (!id) { showMsg("gsheetMsg", "無法辨識試算表 ID，請確認連結格式是否正確。", "error"); return; }
  const gid = extractGid(url);
  showMsg("gsheetMsg", "讀取中，請稍候…", "info");
  const candidates = [
    `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}`,
    `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`,
  ];
  for (const csvUrl of candidates) {
    try {
      const res = await fetch(csvUrl);
      if (!res.ok) continue;
      const text = await res.text();
      if (text.trim().startsWith("<")) continue;
      const parsed = Papa.parse(text, { header:false, skipEmptyLines:true });
      if (parsed.data && parsed.data.length > 1) {
        const headerRow = parsed.data[0];
        const bodyRows = parsed.data.slice(1);
        processIncomingTable(headerRow, bodyRows, "Google 試算表 " + (STATE.sourceCounter+1));
        showMsg("gsheetMsg", `已成功讀取試算表，共 ${bodyRows.length} 筆資料。`, "ok");
        urlInput.value = "";
        return;
      }
    } catch (err) { /* try next candidate */ }
  }
  showMsg("gsheetMsg",
    "讀取失敗。請確認：① 試算表共用權限已設為「知道連結的任何人皆可查看」；② 網址正確。若仍失敗，瀏覽器的跨網域限制可能封鎖了讀取，建議改用「下載為 CSV 後上傳」的方式。",
    "error");
}

/* headers: string[]；rows: 任意值的陣列的陣列；label: 此來源的顯示名稱 */
function processIncomingTable(headers, rows, label) {
  if (!headers || !headers.length || !rows || !rows.length) { showMsg("fileMsg", `「${label}」沒有讀取到任何資料。`, "error"); return; }
  const cleanHeaders = headers.map(h => cellToStr(h));

  const ipaPairs = detectWideFormat(cleanHeaders);
  if (ipaPairs.length >= 2) {
    const longRows = convertWideRowsToLongRows(rows, ipaPairs);
    addSource(label, "wide", longRows);
    showMsg("fileMsg", `「${label}」偵測為 IPA 寬表格，已加入（${ipaPairs.length} 個題項）。`, "ok");
    renderSourcesAndAlign();
    return;
  }
  const kanoPairs = detectKanoWideFormat(cleanHeaders, rows);
  if (kanoPairs.length >= 2) {
    const longRows = convertKanoWideRowsToLongRows(rows, kanoPairs);
    addSource(label, "wideKano", longRows);
    showMsg("fileMsg", `「${label}」偵測為 Kano 專用寬表格，已加入（${kanoPairs.length} 個題項）。`, "ok");
    renderSourcesAndAlign();
    return;
  }
  // 無法自動偵測，開啟手動欄位對應
  STATE.pendingSource = { label, headers: cleanHeaders, rawRows: rows, mapping: guessMapping(cleanHeaders) };
  renderPendingMappingForm();
}

function renderPendingMappingForm() {
  const p = STATE.pendingSource;
  if (!p) return;
  document.getElementById("pendingCard").style.display = "block";
  document.getElementById("pendingLabel").textContent = p.label;
  const fields = [
    ["item","題項名稱",true],
    ["importance","重要度",false],
    ["performance","表現度／滿意度",false],
    ["kanoFunc","Kano 正向題",false],
    ["kanoDys","Kano 反向題",false],
    ["comment","補充說明（選填）",false],
  ];
  const options = ["<option value=''>（不對應）</option>"].concat(
    p.headers.map((h,idx) => `<option value="${idx}">第 ${idx+1} 欄：${escapeHtml(h)}</option>`)
  ).join("");
  document.getElementById("pendingMappingForm").innerHTML = fields.map(([key,label,req]) => `
    <div class="mapping-row">
      <label>${label}${req ? ' <span class="req">*</span>' : ''}</label>
      <select data-field="${key}">${options}</select>
    </div>
  `).join("");
  fields.forEach(([key]) => {
    const sel = document.querySelector(`#pendingMappingForm select[data-field="${key}"]`);
    if (p.mapping[key] !== null && p.mapping[key] !== undefined) sel.value = String(p.mapping[key]);
    sel.onchange = () => { p.mapping[key] = sel.value === "" ? null : Number(sel.value); };
  });
  document.getElementById("btnConfirmPending").onclick = () => {
    if (p.mapping.item === null) { showMsg("pendingMsg", "請至少對應「題項」欄位。", "error"); return; }
    if (p.mapping.importance === null && p.mapping.kanoFunc === null) {
      showMsg("pendingMsg", "請至少對應「重要度」或「Kano 正向題」其中一項，否則此來源沒有可用資料。", "error");
      return;
    }
    const longRows = buildLongRowsFromMapping(p.rawRows, p.mapping);
    addSource(p.label, "long", longRows);
    STATE.pendingSource = null;
    document.getElementById("pendingCard").style.display = "none";
    showMsg("fileMsg", `「${p.label}」已加入。`, "ok");
    renderSourcesAndAlign();
  };
  document.getElementById("btnCancelPending").onclick = () => {
    STATE.pendingSource = null;
    document.getElementById("pendingCard").style.display = "none";
  };
}

function renderSourcesAndAlign() {
  const sourcesCard = document.getElementById("sourcesCard");
  const alignCard = document.getElementById("alignCard");
  if (!STATE.sources.length) {
    sourcesCard.style.display = "none";
    alignCard.style.display = "none";
    return;
  }
  sourcesCard.style.display = "block";
  document.getElementById("sourcesTable").innerHTML = `
    <thead><tr><th>來源</th><th>格式</th><th>題項數</th><th>資料筆數</th><th></th></tr></thead>
    <tbody>${STATE.sources.map(s => `
      <tr>
        <td>${escapeHtml(s.label)}</td>
        <td>${MODE_LABEL[s.mode] || s.mode}</td>
        <td>${s.itemCount}</td>
        <td>${s.rowCount}</td>
        <td><button class="btn ghost small" data-remove-src="${s.id}">移除</button></td>
      </tr>`).join("")}</tbody>
  `;
  document.querySelectorAll("[data-remove-src]").forEach(btn => {
    btn.onclick = () => { removeSource(btn.dataset.removeSrc); renderSourcesAndAlign(); };
  });

  alignCard.style.display = "block";
  const rawStats = collectRawItemStats();
  const suggestion = suggestCanonicalLabels(rawStats);
  document.getElementById("alignTable").innerHTML = `
    <thead><tr><th>原始題項名稱</th><th>來源</th><th>筆數</th><th>統一顯示名稱</th></tr></thead>
    <tbody>${rawStats.map(e => `
      <tr>
        <td>${escapeHtml(e.rawName)}</td>
        <td>${e.sourceLabels.map(escapeHtml).join("、")}</td>
        <td>${e.count}</td>
        <td><input type="text" data-raw="${escapeHtml(e.rawName)}" value="${escapeHtml(suggestion[e.rawName] || e.rawName)}"></td>
      </tr>`).join("")}</tbody>
  `;
  document.getElementById("btnRunMergedAnalysis").onclick = () => {
    const labelMap = {};
    document.querySelectorAll('#alignTable input[data-raw]').forEach(input => {
      labelMap[input.dataset.raw] = input.value.trim() || input.dataset.raw;
    });
    finalizeMergedAnalysis(labelMap);
    activeTab = STATE.hasIPAData ? "ipa" : (STATE.hasKanoData ? "kano" : "priority");
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === activeTab));
    renderActiveTab();
    window.scrollTo && window.scrollTo({ top: 0, behavior: "smooth" });
  };
}

function initIPATab() {
  if (!STATE.analyzed || !STATE.hasIPAData) return;

    const xMin = Number(document.getElementById("ipaXMin").value);
    const xMax = Number(document.getElementById("ipaXMax").value);
    const yMin = Number(document.getElementById("ipaYMin").value);
    const yMax = Number(document.getElementById("ipaYMax").value);
    if ([xMin, xMax, yMin, yMax].some(v => isNaN(v))) {
      showAxisMsg("請輸入有效的數字。", "error");
      return;
    }
    if (xMin >= xMax || yMin >= yMax) {
      showAxisMsg("起始數字必須小於結束數字。", "error");
      return;
    }
    ipaAxisRange = { xMin, xMax, yMin, yMax };
    showAxisMsg("已套用新的座標軸範圍。", "ok");
    drawIPAChart();
  };
  document.getElementById("btnResetAxisRange").onclick = () => {
    ipaAxisRange = { xMin: 0, xMax: 10, yMin: 0, yMax: 10 };
    document.getElementById("ipaXMin").value = 0;
    document.getElementById("ipaXMax").value = 10;
    document.getElementById("ipaYMin").value = 0;
    document.getElementById("ipaYMax").value = 10;

function showAxisMsg(text, type) {
  const el = document.getElementById("ipaAxisMsg");
  if (el) el.innerHTML = `<div class="msg ${type}">${escapeHtml(text)}</div>`;
}

function drawIPAChart() {
  const ctx = document.getElementById("ipaChart");
  if (!ctx) return;
  if (ipaChartInstance) ipaChartInstance.destroy();
  const points = STATE.items.filter(i => i.impMean !== null && i.perfMean !== null);
  const { xMin, xMax, yMin, yMax } = ipaAxisRange;
  const quadrantBgPlugin = {
    id: "quadrantBg",
    beforeDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea) return;
      const xMid = scales.x.getPixelForValue(STATE.grandImp);
      const yMid = scales.y.getPixelForValue(STATE.grandPerf);
      // 依象限著色四塊：x=重要度, y=表現度
      const zones = [
        { color:"#30D158", x0:xMid, x1:chartArea.right, y0:chartArea.top, y1:yMid }, // 高重要 高表現 = Q1（右上）
        { color:"#FF3B30", x0:xMid, x1:chartArea.right, y0:yMid, y1:chartArea.bottom }, // 高重要 低表現 = Q2（右下）
        { color:"#8E8E93", x0:chartArea.left, x1:xMid, y0:yMid, y1:chartArea.bottom }, // 低重要 低表現 = Q3（左下）
        { color:"#AF52DE", x0:chartArea.left, x1:xMid, y0:chartArea.top, y1:yMid }, // 低重要 高表現 = Q4（左上）
      ];
      ctx.save();
      ctx.globalAlpha = 0.08;
      zones.forEach(z => { ctx.fillStyle = z.color; ctx.fillRect(z.x0, z.y0, z.x1-z.x0, z.y1-z.y0); });
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = "#94A3B8"; ctx.setLineDash([5,4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xMid, chartArea.top); ctx.lineTo(xMid, chartArea.bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(chartArea.left, yMid); ctx.lineTo(chartArea.right, yMid); ctx.stroke();
      ctx.restore();
    }
  };
  ipaChartInstance = new Chart(ctx, {
    type: "scatter",
    data: {
      datasets: [{
        label: "題項",
        data: points.map(i => ({ x: i.impMean, y: i.perfMean, label: i.item, quadrant: i.quadrant })),
        backgroundColor: points.map(i => QUADRANT_COLOR_HEX[i.quadrant] || "#666"),
        pointRadius: 7,
        pointHoverRadius: 9,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { min:xMin, max:xMax, title:{ display:true, text:"重要度" }, grid:{ color:"#EDF2F7" } },
        y: { min:yMin, max:yMax, title:{ display:true, text:"表現度（滿意度）" }, grid:{ color:"#EDF2F7" } },
      },
      plugins: {
        legend: { display:false },
        tooltip: {
          callbacks: {
            label(ctx) {
              const d = ctx.raw;
              return `${d.label}：重要度 ${d.x.toFixed(1)}，表現度 ${d.y.toFixed(1)}`;
            }
          }
        }
      }
    },
    plugins: [quadrantBgPlugin]
  });
}
const QUADRANT_COLOR_HEX = { Q1:"#30D158", Q2:"#FF3B30", Q3:"#8E8E93", Q4:"#AF52DE" };

}

function drawKanoCharts() {

/* ===================== ⑤ 柏拉圖分析 ===================== */
function paretoMetricLabel() {
  return STATE.hasIPAData ? "重要度－表現度落差" : "Kano 必須＋一維品質票數（M+O）";
}
function paretoValue(it) {
  if (STATE.hasIPAData) return Math.max(0, gapOf(it));
  if (STATE.hasKanoData) return (it.votes.M || 0) + (it.votes.O || 0);
  return 0;
}
function computeParetoData() {
  const sorted = [...STATE.items].sort((a,b) => paretoValue(b) - paretoValue(a));
  const total = sorted.reduce((s,it) => s + paretoValue(it), 0);
  let cum = 0;
  return sorted.map(it => {
    const v = paretoValue(it);
    cum += v;
    const cumPct = total > 0 ? (cum / total * 100) : 0;
    return { item: it.item, value: v, cumPct, vitalFew: cumPct <= 80 };
  });
}

function renderParetoTab() {
  if (!STATE.analyzed) return emptyStateHtml();
  return `
  <div class="card">
    <h2>柏拉圖分析（80/20 法則）</h2>
    <p class="sub">白話說明：柏拉圖是常見的品質管理手法，把各題項依「待改善程度」由大到小排序畫成長條圖，再疊加一條「累積百分比」曲線。通常前面幾項就佔了整體問題的八成，這些就是最值得優先處理的「關鍵少數」，其餘則是影響較小的「次要多數」。</p>
    <p class="sub">本次採用指標：<b>${paretoMetricLabel()}</b></p>
    <div class="chart-wrap"><canvas id="paretoChart"></canvas></div>
    <div class="legend">
      <span><i style="background:#0071E3"></i>關鍵少數（累積 80% 以內）</span>
      <span><i style="background:#CDE6FF"></i>次要多數</span>
      <span><i style="background:#FF9500"></i>累積百分比（右軸）</span>
      <span><i style="background:#94A3B8"></i>80% 參考線</span>
    </div>
  </div>
  <div class="card">
    <h2>柏拉圖明細表</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>排序</th><th>題項</th><th>${paretoMetricLabel()}</th><th>累積百分比</th><th>分類</th></tr></thead>
        <tbody id="paretoTableBody"></tbody>
      </table>
    </div>
  </div>
  `;
}

let paretoChartInstance = null;
function initParetoTab() {
  if (!STATE.analyzed) return;
  const data = computeParetoData();
  document.getElementById("paretoTableBody").innerHTML = data.map((d, idx) => `
    <tr>
      <td>${idx+1}</td>
      <td>${escapeHtml(d.item)}</td>
      <td>${d.value.toFixed(1)}</td>
      <td>${d.cumPct.toFixed(1)}%</td>
      <td>${d.vitalFew ? badge("關鍵少數", "var(--p1)") : badge("次要多數", "var(--muted)")}</td>
    </tr>`).join("") || `<tr><td colspan="5" class="empty-state">尚無資料</td></tr>`;
  drawParetoChart(data);
}

function drawParetoChart(data) {
  const ctx = document.getElementById("paretoChart");
  if (!ctx) return;
  if (paretoChartInstance) paretoChartInstance.destroy();
  paretoChartInstance = new Chart(ctx, {
    type: "bar",
    data: {
      labels: data.map(d => d.item),
      datasets: [
        {
          type: "bar", label: "待改善程度", data: data.map(d => d.value),
          backgroundColor: data.map(d => d.vitalFew ? "#0071E3" : "#CDE6FF"), yAxisID: "y",
        },
        {
          type: "line", label: "累積百分比", data: data.map(d => d.cumPct),
          borderColor: "#FF9500", backgroundColor: "#FF9500", yAxisID: "y1",
          tension: 0.2, pointRadius: 3,
        },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { ticks: { autoSkip:false, maxRotation:60, minRotation:30 } },
        y: { beginAtZero:true, title:{ display:true, text:"待改善程度" } },
        y1: { beginAtZero:true, max:100, position:"right", grid:{ drawOnChartArea:false }, title:{ display:true, text:"累積百分比 (%)" } },
      },
      plugins: { legend: { display:false } }
    },
    plugins: [{
      id: "eightyLine",
      afterDraw(chart) {
        const y1 = chart.scales.y1;
        if (!y1) return;
        const yPix = y1.getPixelForValue(80);
        const { left, right } = chart.chartArea;
        const c = chart.ctx;
        c.save();
        c.strokeStyle = "#94A3B8"; c.setLineDash([5,4]); c.lineWidth = 1;
        c.beginPath(); c.moveTo(left, yPix); c.lineTo(right, yPix); c.stroke();
        c.restore();
      }
    }]
  });
}

    const sorted = ipaOnlyRank(STATE.items);
    return `
      <h2>改善優先序（IPA 象限＋落差排序）</h2>
      <p>此份資料未包含 Kano 正反題，以 IPA 象限搭配落差程度排序。</p>
      <table><thead><tr><th>順位</th><th>題項</th><th>IPA 象限</th><th>重要度</th><th>表現度</th><th>落差</th></tr></thead><tbody>
        ${sorted.map((i,idx) => `<tr><td>${idx+1}</td><td>${escapeHtml(i.item)}</td><td>${i.quadrant?QUADRANT_LABEL[i.quadrant]:"—"}</td><td>${fmt1(i.impMean)}</td><td>${fmt1(i.perfMean)}</td><td>${fmt1(gapOf(i))}</td></tr>`).join("")}
      </tbody></table>`;
  }
  if (!STATE.hasIPAData && STATE.hasKanoData) {
    const sorted = kanoOnlyRank(STATE.items);
    return `
      <h2>改善優先序（Kano 屬性排序）</h2>
      <p>此份資料未包含重要度／表現度評分，以 Kano 屬性急迫性排序（必須品質優先）。</p>
      <table><thead><tr><th>順位</th><th>題項</th><th>Kano 屬性</th><th>票數（M/O/A/I/R/Q）</th><th>有效樣本</th></tr></thead><tbody>
        ${sorted.map((i,idx) => `<tr><td>${idx+1}</td><td>${escapeHtml(i.item)}</td><td>${i.finalAttr?ATTR_LABEL[i.finalAttr]:"待覆核"}</td><td>${i.votes.M}/${i.votes.O}/${i.votes.A}/${i.votes.I}/${i.votes.R}/${i.votes.Q}</td><td>${i.totalVotes}</td></tr>`).join("")}
      </tbody></table>`;
  }
  return `<h2>改善優先序</h2><p>尚無足夠資料可產出優先序。</p>`;
}

function captureParetoChartImage(data) {
  try {
    const canvas = document.createElement("canvas");
    canvas.width = 700; canvas.height = 380;
    canvas.style.position = "fixed"; canvas.style.left = "-9999px";
    document.body.appendChild(canvas);
    const tempChart = new Chart(canvas, {
      type: "bar",
      data: {
        labels: data.map(d => d.item),
        datasets: [
          { type:"bar", data: data.map(d=>d.value), backgroundColor: data.map(d=>d.vitalFew?"#0071E3":"#CDE6FF"), yAxisID:"y" },
          { type:"line", data: data.map(d=>d.cumPct), borderColor:"#FF9500", backgroundColor:"#FF9500", yAxisID:"y1", tension:0.2, pointRadius:3 },
        ]
      },
      options: {
        responsive:false, animation:false,
        scales: { y:{beginAtZero:true}, y1:{beginAtZero:true,max:100,position:"right",grid:{drawOnChartArea:false}} },
        plugins: { legend:{display:false} }
      }
    });
    tempChart.update();
    const img = tempChart.toBase64Image();
    tempChart.destroy();
    document.body.removeChild(canvas);
    return img;
  } catch (e) { return null; }
}

function reportParetoSection() {
  if (!STATE.items.length) return `<h2>柏拉圖分析</h2><p>目前尚無資料。</p>`;
  const data = computeParetoData();
  const img = captureParetoChartImage(data);
  return `
    <h2>柏拉圖分析（80/20 法則）</h2>
    <p>採用指標：${paretoMetricLabel()}。累積百分比達 80% 以內者列為「關鍵少數」，優先處理。</p>
    ${img ? `<img src="${img}" alt="柏拉圖">` : ""}
    <table><thead><tr><th>排序</th><th>題項</th><th>${paretoMetricLabel()}</th><th>累積百分比</th><th>分類</th></tr></thead><tbody>
      ${data.map((d,idx) => `<tr><td>${idx+1}</td><td>${escapeHtml(d.item)}</td><td>${d.value.toFixed(1)}</td><td>${d.cumPct.toFixed(1)}%</td><td>${d.vitalFew?"關鍵少數":"次要多數"}</td></tr>`).join("")}
    </tbody></table>
  `;
}

function reportCommentsSection() {
  const withComments = STATE.items.filter(i => i.comments && i.comments.length);
  if (!withComments.length) return `<h2>補充意見</h2><p>此份資料沒有補充說明欄位內容。</p>`;
  return `
    <h2>補充意見彙整</h2>
    ${withComments.map(i => `<p><b>${escapeHtml(i.item)}</b>（${i.comments.length} 則）：${i.comments.map(escapeHtml).join("；")}</p>`).join("")}
  `;
}

function buildReportHTML() {
  return `
    <h1>產品／服務滿意度分析報告</h1>
    <div class="report-meta">產出時間：${nowStr()}　｜　分析題項數：${STATE.items.length}</div>
    <h2>資料來源</h2>
    ${reportSourceSummary()}
    ${reportIPASection()}
    ${reportKanoSection()}
    ${reportPrioritySection()}
    ${reportParetoSection()}
    ${reportCommentsSection()}
  `;
}

function downloadWordReport() {
  const content = buildReportHTML();
  const wordHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>滿意度分析報告</title>
  <style>
    body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;color:#2D3748;}
    h1{font-size:20pt;color:#1D1D1F;} h2{font-size:14pt;color:#1D1D1F;border-bottom:1pt solid #0071E3;padding-bottom:4pt;margin-top:20pt;}
    table{border-collapse:collapse;width:100%;font-size:10pt;} th,td{border:1pt solid #CBD5E0;padding:4pt 6pt;text-align:left;} th{background:#F1F5FB;}
    .report-meta{color:#718096;font-size:9pt;}
    .report-stat-row{display:table;width:100%;} .report-stat{display:table-cell;border:1pt solid #E2E8F0;padding:8pt;text-align:center;}
    .report-stat .num{font-size:16pt;font-weight:bold;color:#1D1D1F;display:block;} .report-stat .lbl{font-size:9pt;color:#718096;}
    img{max-width:100%;}
  </style></head><body>${content}</body></html>`;
  const blob = new Blob(["﻿", wordHtml], { type: "application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "滿意度分析報告.doc"; a.click();
  URL.revokeObjectURL(url);
}

function printPdfReport() {
  const content = buildReportHTML();
  const root = document.getElementById("printReportRoot");
  if (root) root.innerHTML = `<div class="report-doc">${content}</div>`;
  window.print();
}

function renderExportTab() {
  if (!STATE.analyzed) return emptyStateHtml();
  return `
  <div class="card">
    <h2>匯出分析報告</h2>
    <p class="sub">將目前的分析結果（IPA 矩陣、Kano 分析、整合優先序、柏拉圖分析、補充意見）彙整成一份報告。</p>
    <div class="pill-row">
      <button class="btn" id="btnExportWord">下載 Word 報告 (.doc)</button>
      <button class="btn secondary" id="btnExportPdf">列印／另存為 PDF</button>
    </div>
    <div class="term-note">白話說明：「下載 Word 報告」會產生一份可直接用 Microsoft Word 開啟編輯的報告檔；「列印／另存為 PDF」會開啟瀏覽器的列印視窗，請在「目的地」選擇「另存為 PDF」即可得到 PDF 檔案。</div>
  </div>
  <div class="card">
    <h2>報告預覽</h2>
    <div class="export-preview report-doc" id="exportPreview"></div>
  </div>
  `;
}

function initExportTab() {
  if (!STATE.analyzed) return;
  const preview = document.getElementById("exportPreview");
  if (preview) preview.innerHTML = buildReportHTML();
  const btnWord = document.getElementById("btnExportWord");
  const btnPdf = document.getElementById("btnExportPdf");
  if (btnWord) btnWord.onclick = downloadWordReport;
  if (btnPdf) btnPdf.onclick = printPdfReport;
}


/* ===================== 主程式：頁籤切換與啟動 ===================== */
const TAB_RENDERERS = {
  import: { render: renderImportTab, init: initImportTab },
  ipa: { render: renderIPATab, init: initIPATab },
  kano: { render: renderKanoTab, init: initKanoTab },
  priority: { render: renderPriorityTab, init: initPriorityTab },
  pareto: { render: renderParetoTab, init: initParetoTab },
  comments: { render: renderCommentsTab, init: initCommentsTab },
  export: { render: renderExportTab, init: initExportTab },
};
let activeTab = "import";

function renderActiveTab() {
  const main = document.getElementById("mainArea");
  const cfg = TAB_RENDERERS[activeTab];
  main.innerHTML = `<div class="tab-panel active">${cfg.render()}</div>`;
  cfg.init();
}

function refreshTabBadges() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    const tab = btn.dataset.tab;
    btn.classList.toggle("active", tab === activeTab);
  });
}

function initTabs() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
      renderActiveTab();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
  });
}

document.addEventListener("DOMContentLoaded", () => {
  initTabs();
  renderActiveTab();
});

</script>
</body>
